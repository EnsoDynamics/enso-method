name: Skill Frontmatter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Parse every SKILL.md frontmatter strictly
        # Strict YAML parsers (the skills CLI, Codex) silently skip a skill whose
        # frontmatter fails to parse, or whose description is over 1024 characters
        # (Codex rejects it), so a bad description must fail the build.
        run: |
          pip install --quiet -r requirements-lock.txt
          python3 - <<'EOF'
          import pathlib, sys, yaml
          bad = []
          skills = sorted(pathlib.Path('skills').glob('*/SKILL.md'))
          for path in skills:
              text = path.read_text()
              if not text.startswith('---\n'):
                  bad.append(f'{path}: no frontmatter')
                  continue
              try:
                  meta = yaml.safe_load(text.split('\n---', 1)[0][4:])
              except yaml.YAMLError as error:
                  bad.append(f'{path}: {str(error).splitlines()[0]}')
                  continue
              if not isinstance(meta, dict):
                  bad.append(f'{path}: frontmatter is not a mapping')
              elif meta.get('name') != path.parent.name:
                  bad.append(f'{path}: name does not match its directory')
              elif not meta.get('description'):
                  bad.append(f'{path}: missing description')
              elif len(str(meta['description'])) > 1024:
                  bad.append(f'{path}: description over 1024 characters')
          print('\n'.join(bad) or f'{len(skills)} skills OK')
          sys.exit(1 if bad else 0)
          EOF
      - name: Check the plugin manifests agree
        # plugin.json (the portable Agent Plugins format, canonical for Codex,
        # which reads its OpenAI settings from extensions.com.openai) and
        # .claude-plugin/ (Claude Code's format) describe the same plugin, so a
        # drifted name would ship two prefixes. Both stay unversioned so
        # installs follow new commits.
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          root = json.loads(pathlib.Path('plugin.json').read_text())
          claude = json.loads(pathlib.Path('.claude-plugin/plugin.json').read_text())
          market = json.loads(pathlib.Path('.claude-plugin/marketplace.json').read_text())
          bad = []
          allowed = {'$schema', 'name', 'version', 'description', 'author', 'homepage',
                     'repository', 'license', 'keywords', 'extensions'}
          if root.get('$schema') != 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json':
              bad.append('plugin.json: $schema is not Agent Plugins 1.0.0')
          if set(root) - allowed:
              bad.append(f'plugin.json: fields outside the Agent Plugins schema: {sorted(set(root) - allowed)}')
          names = {root.get('name'), claude.get('name')} | {p.get('name') for p in market.get('plugins', [])}
          if len(names) != 1:
              bad.append(f'plugin names disagree: {sorted(map(str, names))}')
          if 'version' in root or 'version' in claude:
              bad.append('a manifest pins version; installs then stop following new commits')
          if pathlib.Path('.codex-plugin/plugin.json').exists():
              bad.append('.codex-plugin/plugin.json would be ignored; OpenAI settings live in plugin.json extensions.com.openai')
          icon = root.get('extensions', {}).get('com.openai', {}).get('interface', {}).get('composerIcon', '')
          if not icon or not pathlib.Path(icon).is_file():
              bad.append('plugin.json extensions.com.openai.interface.composerIcon is missing')
          print('\n'.join(bad) or f'manifests OK: {names.pop()}')
          sys.exit(1 if bad else 0)
          EOF
